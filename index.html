<head>
  <meta charset="UTF-8" />
  <script>
    // Set the theme before first paint to avoid a flash. Kept in sync with useTheme in src/lib/hooks.ts.
    try { var theme = localStorage.getItem('theme') } catch (e) { }
    var dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.add(dark ? 'dark' : 'light');
  </script>
